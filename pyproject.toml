[project]
name = "adm"
version = "0.1.0"
description = "Problems and algorithms for the ADM companion site"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.5",
    "scipy>=1.18",
]

[dependency-groups]
site = [
    "matplotlib>=3.11",
    "plotly>=7.1",
    "ipykernel>=7.3",
    "nbformat>=5.11",
    "nbclient>=0.11",
    "pyyaml>=6.0",
]
dev = [
    "pytest>=9.1",
]

[tool.uv]
default-groups = ["site", "dev"]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tools"]
